<!-- =====================================================
     HERO GRAPHIC — VERSION 2 (Apple HIG Upgrade)
     Professional hub-and-spoke: Limo center + 4 service
     satellites (Web, AI & Auto, Apps, Data) with animated
     traveling dots, orbit rings, glow filters & labels.
     ===================================================== -->
<svg class="hero-svg-anim" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="hubGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="hubGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="55%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="glowBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .fp  { stroke-dasharray: 6 5; animation: fwd 2.5s linear infinite; }
      .fps { stroke-dasharray: 6 5; animation: fwd 3.8s linear infinite; }
      .fpr { stroke-dasharray: 6 5; animation: rev 3s linear infinite; }
      @keyframes fwd { to { stroke-dashoffset: -44; } }
      @keyframes rev { to { stroke-dashoffset:  44; } }
      .hr1 { animation: hp 2.8s ease-in-out infinite; }
      .hr2 { animation: hp 2.8s 1.1s ease-in-out infinite; }
      @keyframes hp { 0%,100%{ opacity:.28; } 50%{ opacity:.06; } }
      .nf1 { animation: nf 4s 0s  ease-in-out infinite; }
      .nf2 { animation: nf 4s 1s  ease-in-out infinite; }
      .nf3 { animation: nf 4s 2s  ease-in-out infinite; }
      .nf4 { animation: nf 4s 3s  ease-in-out infinite; }
      @keyframes nf { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) {
        .fp,.fps,.fpr,.hr1,.hr2,.nf1,.nf2,.nf3,.nf4 { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#gridPat)"/>
  <ellipse cx="200" cy="200" rx="96" ry="96" fill="url(#glowBg)"/>

  <!-- Orbit rings -->
  <circle cx="200" cy="200" r="134" stroke="#EAB308" stroke-width="0.8" stroke-opacity="0.1" stroke-dasharray="4 9"/>
  <circle cx="200" cy="200" r="82"  stroke="#EAB308" stroke-width="0.6" stroke-opacity="0.08" stroke-dasharray="3 7"/>

  <!-- Connection base lines -->
  <path d="M200 200 C162 178,118 148,72 102" stroke="#EAB308" stroke-width="1.4" stroke-opacity="0.14" stroke-linecap="round"/>
  <path d="M200 200 C232 174,277 143,328 98"  stroke="#2E5A35" stroke-width="1.4" stroke-opacity="0.14" stroke-linecap="round"/>
  <path d="M200 200 C247 232,288 267,332 302" stroke="#EAB308" stroke-width="1.4" stroke-opacity="0.14" stroke-linecap="round"/>
  <path d="M200 200 C162 228,116 264,68 302"  stroke="#2E5A35" stroke-width="1.4" stroke-opacity="0.14" stroke-linecap="round"/>

  <!-- Animated flow dashes -->
  <path d="M200 200 C162 178,118 148,72 102"  stroke="#EAB308" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" class="fp"/>
  <path d="M200 200 C232 174,277 143,328 98"  stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" class="fps"/>
  <path d="M200 200 C247 232,288 267,332 302" stroke="#EAB308" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" class="fp"/>
  <path d="M68 302 C116 264,162 228,200 200"  stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" class="fpr"/>

  <!-- Hub pulse rings -->
  <circle cx="200" cy="200" r="50" fill="none" stroke="#EAB308" stroke-width="18" stroke-opacity="0.07" class="hr1"/>
  <circle cx="200" cy="200" r="50" fill="none" stroke="#EAB308" stroke-width="9"  stroke-opacity="0.09" class="hr2"/>

  <!-- Centre Hub -->
  <circle cx="200" cy="200" r="38" fill="url(#hubGrad)" filter="url(#hubGlow)"/>
  <ellipse cx="193" cy="186" rx="16" ry="9" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="200" cy="200" r="38" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.5"/>
  <text x="200" y="207" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif"
    font-size="17" font-weight="800" fill="#1C1D1F" letter-spacing="-0.5">limu</text>

  <!-- Node 1 – Web (top-left 72,102) -->
  <g class="nf1">
    <circle cx="72" cy="102" r="27" fill="#111214" filter="url(#nodeGlow)" fill-opacity="0.18"/>
    <circle cx="72" cy="102" r="27" fill="#1C1D1F"/>
    <ellipse cx="66" cy="92" rx="10" ry="5" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="72" cy="102" r="27" fill="none" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.45"/>
    <rect x="59" y="92" width="26" height="17" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="72" y1="109" x2="72" y2="114" stroke="#EAB308" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="67" y1="114" x2="77" y2="114" stroke="#EAB308" stroke-width="1.5" stroke-linecap="round"/>
    <text x="72" y="139" text-anchor="middle"
      font-family="-apple-system,'Inter',sans-serif" font-size="9.5" font-weight="700"
      fill="currentColor" fill-opacity="0.48" letter-spacing="0.2">Web</text>
  </g>

  <!-- Node 2 – AI (top-right 328,98) -->
  <g class="nf2">
    <circle cx="328" cy="98" r="27" fill="#1A3520" filter="url(#nodeGlow)" fill-opacity="0.22"/>
    <circle cx="328" cy="98" r="27" fill="#2E5A35"/>
    <ellipse cx="322" cy="88" rx="10" ry="5" fill="#FFFFFF" fill-opacity="0.09"/>
    <circle cx="328" cy="98" r="27" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M328 86 L330 94 L338 98 L330 102 L328 110 L326 102 L318 98 L326 94 Z" fill="#FFFFFF"/>
    <text x="328" y="134" text-anchor="middle"
      font-family="-apple-system,'Inter',sans-serif" font-size="9.5" font-weight="700"
      fill="#4CAF50" fill-opacity="0.72" letter-spacing="0.2">AI &amp; Auto</text>
  </g>

  <!-- Node 3 – Apps (bottom-right 332,302) -->
  <g class="nf3">
    <circle cx="332" cy="302" r="27" fill="#987108" filter="url(#nodeGlow)" fill-opacity="0.22"/>
    <circle cx="332" cy="302" r="27" fill="#EAB308"/>
    <ellipse cx="326" cy="292" rx="10" ry="5" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="332" cy="302" r="27" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="322" y="290" width="20" height="24" rx="4" fill="none" stroke="#1C1D1F" stroke-width="1.5"/>
    <circle cx="332" cy="311" r="1.8" fill="#1C1D1F"/>
    <line x1="327" y1="295" x2="337" y2="295" stroke="#1C1D1F" stroke-width="1" stroke-opacity="0.25"/>
    <text x="332" y="337" text-anchor="middle"
      font-family="-apple-system,'Inter',sans-serif" font-size="9.5" font-weight="700"
      fill="#B45309" fill-opacity="0.8" letter-spacing="0.2">Apps</text>
  </g>

  <!-- Node 4 – Data (bottom-left 68,302) -->
  <g class="nf4">
    <circle cx="68" cy="302" r="27" fill="#111214" filter="url(#nodeGlow)" fill-opacity="0.18"/>
    <circle cx="68" cy="302" r="27" fill="#1C1D1F"/>
    <ellipse cx="62" cy="292" rx="10" ry="5" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="68" cy="302" r="27" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="57" y="305" width="5" height="9"  rx="1.5" fill="#EAB308"/>
    <rect x="64" y="298" width="5" height="16" rx="1.5" fill="#FFFFFF"/>
    <rect x="71" y="302" width="5" height="12" rx="1.5" fill="#4CAF50" opacity="0.75"/>
    <text x="68" y="337" text-anchor="middle"
      font-family="-apple-system,'Inter',sans-serif" font-size="9.5" font-weight="700"
      fill="currentColor" fill-opacity="0.48" letter-spacing="0.2">Data</text>
  </g>

  <!-- Travel dots -->
  <path id="pw" d="M200 200 C162 178,118 148,72 102" fill="none"/>
  <circle r="3.5" fill="#EAB308" opacity="0">
    <animateMotion dur="2.5s" repeatCount="indefinite"><mpath href="#pw"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <path id="pai" d="M200 200 C232 174,277 143,328 98" fill="none"/>
  <circle r="3.5" fill="#4CAF50" opacity="0">
    <animateMotion dur="3.8s" repeatCount="indefinite" begin="0.6s"><mpath href="#pai"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.8s" repeatCount="indefinite" begin="0.6s"/>
  </circle>

  <path id="pap" d="M200 200 C247 232,288 267,332 302" fill="none"/>
  <circle r="3.5" fill="#EAB308" opacity="0">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.2s"><mpath href="#pap"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

  <path id="pd" d="M68 302 C116 264,162 228,200 200" fill="none"/>
  <circle r="3.5" fill="#4CAF50" opacity="0">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1.8s"><mpath href="#pd"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" begin="1.8s"/>
  </circle>

</svg>
